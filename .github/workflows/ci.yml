name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (lint, build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  signaling:
    name: Signaling server (integration test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Start signaling server
        # A fast heartbeat so the idle-socket test doesn't wait 30s for a tick.
        env:
          SIGNALING_HEARTBEAT_MS: "1000"
        run: nohup npm start > server.log 2>&1 &
      - name: Wait for it to come up
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/healthz && exit 0
            sleep 1
          done
          echo "Server never became healthy"; cat server.log; exit 1
      - name: Run protocol test
        env:
          SIGNALING_HEARTBEAT_MS: "1000"
        run: npm test
      - name: Show server log on failure
        if: failure()
        run: cat server.log
